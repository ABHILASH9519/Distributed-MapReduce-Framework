name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Format Go sources
        run: gofmt -w .
      - name: Static analysis
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race ./...
      - name: Build command binaries
        run: go build ./cmd/...

name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Format Go sources\n        run: gofmt -w .
      - run: go vet ./...
      - run: go test -race ./...